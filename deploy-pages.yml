name: Deploy static website to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - index.html
      - "*.jpg"
      - "*.jpeg"
      - "*.JPG"
      - "*.mp4"
      - "*.png"
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare static website files
        run: |
          mkdir site
          cp index.html site/
          cp *.jpg site/
          cp *.jpeg site/
          cp *.JPG site/
          cp *.mp4 site/
          cp *.png site/
          touch site/.nojekyll
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
